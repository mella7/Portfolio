# Netlify build settings. Security headers are written to dist/_headers by
# the build, so they stay in one place (scripts/build.mjs).
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /qr/<name> works on a static host too: the name becomes ?c=<name>, the page
# reports the scan and then goes to the homepage.
[[redirects]]
  from = "/qr/*"
  to = "/qr/?c=:splat"
  status = 302
