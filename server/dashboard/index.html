<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Visitor statistics</title>
<link rel="stylesheet" href="/stats/dashboard.css">
<script type="module" src="/stats/dashboard.js"></script>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div>
      <p class="eyebrow">mella7.me</p>
      <h1>Visitor statistics</h1>
    </div>
    <div class="controls" id="controls" hidden>
      <label for="days">Period</label>
      <select id="days">
        <option value="1">Today</option>
        <option value="7">7 days</option>
        <option value="30" selected>30 days</option>
        <option value="90">90 days</option>
        <option value="365">12 months</option>
      </select>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="logout">Lock</button>
    </div>
  </header>

  <form class="login" id="login">
    <label for="token">Dashboard token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>

  <div id="report" hidden>
    <section class="tiles" id="tiles" aria-label="Totals"></section>
    <section class="panel">
      <h2>Per day</h2>
      <div class="chart" id="chart" role="img" aria-label="Views per day"></div>
      <p class="legend"><span class="key key--views"></span>Page views <span class="key key--qr"></span>QR scans</p>
    </section>
    <section class="grid" id="tables"></section>
    <section class="panel">
      <h2>Latest page views</h2>
      <div class="scroll"><table id="recent"><thead><tr><th>When</th><th>Page</th><th>Country</th><th>Device</th><th>Browser</th><th>From</th></tr></thead><tbody></tbody></table></div>
    </section>
    <p class="note">Visitors are counted once per day with an anonymous id that changes daily; no cookies and no IP addresses are stored. This shows what kind of visits you get, not who the people are.</p>
  </div>
</main>
</body>
</html>
